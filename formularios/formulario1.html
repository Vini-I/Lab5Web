<!-- FORMULARIO 1: RECEPCIÓN DE CV PARA PÁGINA DE EMPLEOS -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Empleo</title>
    <link rel="stylesheet" href="/CSS/styles.css" />
</head>
<body>
    <main>
        <h1>Solicitud de Empleo</h1>
        
        <form action="/enviar-cv" method="POST" enctype="multipart/form-data">
            <fieldset>
                <legend>Información Básica</legend>

                <div>
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div>
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" pattern="[0-9\-\+\(\) ]{10,}" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Detalles de la Solicitud</legend>

                <div>
                    <label for="puesto">Puesto al que aplica:</label>
                    <select id="puesto" name="puesto" required>
                        <option value="">-- Selecciona un puesto --</option>
                        <option value="desarrollador">Desarrollador Web</option>
                        <option value="diseñador">Diseñador Gráfico</option>
                        <option value="gerente">Gerente de Proyectos</option>
                        <option value="analista">Analista de Datos</option>
                    </select>
                </div>

                <div>
                    <label for="experiencia">Años de experiencia:</label>
                    <input type="number" id="experiencia" name="experiencia" min="0" max="70" required>
                </div>

                <div>
                    <label for="cv">Sube tu CV (PDF o DOC):</label>
                    <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required>
                </div>

                <div>
                    <label for="mensaje">Cuéntanos sobre ti:</label>
                    <textarea id="mensaje" name="mensaje" maxlength="500" rows="4"></textarea>
                </div>
            </fieldset>

            <button type="submit">Enviar Solicitud</button>
            <button type="reset">Limpiar Formulario</button>
        </form>
    </main>
</body>
</html>
